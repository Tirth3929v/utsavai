[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utsavai"
version = "2.5.0"
description = "GenAI Cultural & Multi-Scale Event Architect powered by Google Gemini, Streamlit, and Plotly"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "UtsavAI Team", email = "dev@utsavai.org" }
]
keywords = [
    "genai",
    "cultural-events",
    "event-planner",
    "wedding-planner",
    "google-gemini",
    "streamlit",
    "plotly",
    "hackathon",
    "promptwars"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Artistic Software",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "google-genai>=1.0.0",
    "google-generativeai>=0.8.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
    "plotly>=5.22.0",
    "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "bandit>=1.7.8"
]

[project.urls]
Homepage = "https://utsav-ai-planner.streamlit.app"
Repository = "https://github.com/Tirth3929v/utsavai"
Documentation = "https://github.com/Tirth3929v/utsavai#readme"
"Bug Tracker" = "https://github.com/Tirth3929v/utsavai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "config*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:dateutil.*",
    "ignore::DeprecationWarning:google.*"
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["core", "config"]
omit = ["tests/*"]

